[project]
name = "batched-annotation-reviewer-artifact"
version = "1.0.0"
description = "Anonymous reproduction artifact for batched LLM annotation dependence"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib==3.10.6",
  "numpy==2.2.6",
  "scipy==1.16.3",
]

[project.optional-dependencies]
data = [
  "datasets==4.1.1",
  "huggingface-hub==0.34.4",
]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[project.scripts]
reproduce = "batched_annotation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batched_annotation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
